
name: Build ChronoFlow for Apple Silicon

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-macos:
    runs-on: macos-15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python ARM64
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: arm64

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-macos.txt

      - name: Build macOS app
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name ChronoFlow --target-arch arm64 app.py
          ditto -c -k --sequesterRsrc --keepParent dist/ChronoFlow.app ChronoFlow-AppleSilicon.zip

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: ChronoFlow-AppleSilicon
          path: ChronoFlow-AppleSilicon.zip
          if-no-files-found: error
